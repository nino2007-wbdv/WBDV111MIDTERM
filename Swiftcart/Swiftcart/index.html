<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SwiftCart</title>
<style>
/* BODY & FONTS */
body { font-family:'Arial', sans-serif; margin:0; background:#f5f7fa; transition:0.3s; }

/* LOGIN PAGE */
#loginPage {
    width:350px;
    margin:120px auto;
    padding:20px;
    background:white;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
    text-align:center;
}
#loginPage input {
    width:90%; padding:10px; margin:10px 0; border-radius:5px; border:1px solid #ccc;
}
#loginPage button {
    width:95%; padding:10px; border:none; border-radius:5px; background:#0077b6; color:white; cursor:pointer; transition:0.3s;
}
#loginPage button:hover { background:#023e8a; }
#loginError { color:red; font-weight:bold; margin-top:10px; }

/* NAVBAR */
.navbar {
    display:flex; background:rgba(0,0,0,0.5); backdrop-filter:blur(10px); padding:10px; position:sticky; top:0; z-index:100; display:none;
}
.navbar button {
    flex:1; margin:5px; padding:10px; background:#0077b6; border:none; border-radius:8px;
    color:white; font-size:16px; cursor:pointer; transition:0.3s;
}
.navbar button:hover { background:#00b4d8; transform:scale(1.1); }

/* TABS */
.tab { display:none; padding:20px; transition:0.3s; }
.tab.active { display:block; animation:fadeIn 0.5s; }
@keyframes fadeIn { from {opacity:0} to {opacity:1} }

/* CAROUSEL */
.carousel { width:100%; max-width:800px; height:250px; margin:auto; overflow:hidden; border-radius:12px; margin-bottom:20px; }
.slide { width:100%; height:250px; object-fit:cover; display:none; }
.slide.active { display:block; animation:fade 1s; }
@keyframes fade { from {opacity:0;} to {opacity:1;} }

/* TAB BUTTONS */
.content button {
    margin:5px; padding:10px 15px; border:none; border-radius:5px; background:#0077b6;
    color:white; cursor:pointer; transition:0.3s;
}
.content button:hover { background:#00b4d8; transform:scale(1.05); }

/* INFORMATION BOX */
.infoBox { margin-top:10px; padding:10px; background:#fafafa; border-radius:8px; box-shadow:0 0 5px rgba(0,0,0,0.1); }

/* HEADINGS */
h2 { color:#023e8a; }
</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage">
    <h2>SwiftCart Login</h2>
    <input type="text" id="username" placeholder="Username" required><br>
    <input type="password" id="password" placeholder="Password" required><br>
    <button onclick="login()">Login</button>
    <p id="loginError"></p>
</div>

<!-- NAVBAR -->
<div class="navbar" id="navbar">
    <button onclick="showTab('home')">🏠 Home</button>
    <button onclick="showTab('products')">📦 Products</button>
    <button onclick="showTab('cart')">🛒 Cart</button>
    <button onclick="showTab('orders')">📦 Orders</button>
    <button onclick="showTab('reports')">📑 Reports</button>
    <button onclick="logout()">🚪 Logout</button>
</div>

<!-- CONTENT -->
<div class="content">

    <div id="home" class="tab">
        <h2>Welcome to SwiftCart!</h2>
        <div class="carousel">
            <img src="make.jpg" class="slide active">
            <img src="face.jpg" class="slide">
            <img src="pwes.jpg" class="slide">
        </div>
        <p>Manage your products, orders, and sales seamlessly.</p>
    </div>

    <div id="products" class="tab">
        <h2>Products</h2>
        <button onclick="addProduct()">➕ Add Product</button>
        <button onclick="listProducts()">📋 List Products</button>
        <div id="productInfo" class="infoBox">No actions yet.</div>
    </div>

    <div id="cart" class="tab">
        <h2>Cart</h2>
        <button onclick="addToCart()">➕ Add to Cart</button>
        <button onclick="viewCart()">🛒 View Cart</button>
        <div id="cartInfo" class="infoBox">No actions yet.</div>
    </div>

    <div id="orders" class="tab">
        <h2>Orders</h2>
        <button onclick="placeOrder()">✅ Place Order</button>
        <button onclick="viewOrders()">📦 View Orders</button>
        <div id="orderInfo" class="infoBox">No actions yet.</div>
    </div>

    <div id="reports" class="tab">
        <h2>Reports</h2>
        <button onclick="generateReport()">📄 Generate Report</button>
        <div id="reportInfo" class="infoBox">No actions yet.</div>
    </div>

</div>

<script>
// LOGIN
function login(){
    const u=document.getElementById('username').value;
    const p=document.getElementById('password').value;
    if(u==='admin' && p==='swift123'){
        document.getElementById('loginPage').style.display='none';
        document.getElementById('navbar').style.display='flex';
        showTab('home');
    } else {
        document.getElementById('loginError').innerText='❌ Invalid username or password';
    }
}

// LOGOUT
function logout(){ location.reload(); }

// TAB NAVIGATION
function showTab(tabId){
    document.querySelectorAll('.tab').forEach(tab=>tab.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
}

// CAROUSEL
let index=0;
setInterval(()=>{
    let slides=document.querySelectorAll('.slide');
    slides.forEach(s=>s.classList.remove('active'));
    index=(index+1)%slides.length;
    slides[index].classList.add('active');
},3000);

// PRODUCTS
function addProduct(){ document.getElementById('productInfo').innerText='✅ Product added successfully!'; }
function listProducts(){ document.getElementById('productInfo').innerText='📋 Listing all products...'; }

// CART
function addToCart(){ document.getElementById('cartInfo').innerText='🛒 Item added to cart!'; }
function viewCart(){ document.getElementById('cartInfo').innerText='📋 Viewing cart items...'; }

// ORDERS
function placeOrder(){ document.getElementById('orderInfo').innerText='✅ Order placed successfully!'; }
function viewOrders(){ document.getElementById('orderInfo').innerText='📦 Viewing all orders...'; }

// REPORTS
function generateReport(){ document.getElementById('reportInfo').innerText='📄 Report generated successfully!'; }
</script>

</body>
</html>
