<!DOCTYPE html>
<html>
<head>
<title>DASHBOARD</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="page">

<div class="card">

<h1 id="title"></h1>

<ul id="menu"></ul>

</div>

</div>

<script>

const role = localStorage.getItem("role");

const title = document.getElementById("title");
const menu = document.getElementById("menu");

// ================= USER =================
if(role === "user"){

title.innerHTML = "USER DASHBOARD";

menu.innerHTML = `
<li><a href="menu.html">ORDER FOOD</a></li>
<li><a href="feedback.html">FEEDBACK</a></li>
<li><a href="#" onclick="logout()">LOG OUT</a></li>
`;

}

// ================= ADMIN =================
else if(role === "admin"){

title.innerHTML = "ADMIN DASHBOARD";

menu.innerHTML = `
<li><a href="usermanagement.html">USER MANAGEMENT</a></li>
<li><a href="productmanagement.html">PRODUCT MANAGEMENT</a></li>
<li><a href="#" onclick="logout()">LOG OUT</a></li>
`;

}

// ================= NO ACCESS =================
else{

window.location.href = "login.html";

}

// ================= LOGOUT =================
function logout(){
localStorage.clear();
window.location.href = "index.html";
}

</script>

</body>
</html>
