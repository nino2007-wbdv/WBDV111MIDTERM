<!DOCTYPE html>

<title>MENU</title>

<link rel="stylesheet" href="style.css">

<style>
.section-title{
    text-align:center;
    font-size:34px;
    color:gold;
    margin:30px 0;
}

.food-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
}

.food-card{
    background:rgba(255,255,255,0.06);
    border-radius:15px;
    overflow:hidden;
    transition:0.3s;
}

.food-card:hover{
    transform:translateY(-8px);
}

.food-card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.food-content{
    padding:15px;
}

select{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#222;
    color:white;
}

button{
    width:100%;
    margin-top:10px;
    padding:10px;
    border:none;
    border-radius:20px;
    background:linear-gradient(45deg,#c8a951,#f5d27a);
    font-weight:bold;
    cursor:pointer;
}
</style>

</head>
