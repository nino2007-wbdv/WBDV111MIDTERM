<!DOCTYPE html>
<html>
<head>
    <title>Regular Menu - El Grato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1> REGULAR MENU</h1>
</header>

<div class="container">


<div class="card menu-item">
    <img src="lechonbelly.jpeg">
    <h3>Lechon Belly</h3>

    <div class="size-options">

        <button onclick="addToCart('Lechon Belly Small (3kg)',2300)">
            Small (3kg) ₱2,300
        </button>

        <button onclick="addToCart('Lechon Belly Medium (4kg)',3000)">
            Medium (4kg) ₱3,000
        </button>

        <button onclick="addToCart('Lechon Belly Large (5kg)',3700)">
            Large (5kg) ₱3,700
        </button>

        <button onclick="addToCart('Lechon Belly XL (6kg)',4400)">
            Extra Large (6kg) ₱4,400
        </button>

    </div>
</div>


<div class="card menu-item">
    <img src="crispypata.jpeg">
    <h3>Crispy Pata</h3>

    <div class="size-options">

        <button onclick="addToCart('Crispy Pata Small',500)">
            Small ₱500
        </button>

        <button onclick="addToCart('Crispy Pata Medium',600)">
            Medium ₱600
        </button>

    </div>
</div>


<div class="card menu-item">
    <img src="dila.jpeg">
    <h3>Fried Dila</h3>

    <button onclick="addToCart('Fried Dila',280)">
        Add to Cart ₱280
    </button>
</div>


<div class="card menu-item">
    <img src="crispypata.jpeg">
    <h3>Pata Buy 1 Take 1</h3>

    <div class="size-options">

        <button onclick="addToCart('Pata B1T1 Medium',750)">
            Medium ₱750
        </button>

        <button onclick="addToCart('Pata B1T1 Large',850)">
            Large ₱850
        </button>

        <button onclick="addToCart('Pata B1T1 Jumbo',950)">
            Jumbo ₱950
        </button>

        <button onclick="addToCart('Pata B1T1 Super Jumbo',1050)">
            Super Jumbo ₱1,050
        </button>

    </div>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
