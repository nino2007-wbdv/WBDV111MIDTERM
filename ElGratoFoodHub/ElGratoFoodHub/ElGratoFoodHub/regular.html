<!DOCTYPE html>
<html>
<head>
<title>Regular Menu</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h2>Regular Menu</h2>

    <nav>
        <a href="index.html">Home</a>
        <a href="special.html">Special</a>
        <a href="cart.html">Cart</a>
    </nav>
</header>

<section class="cards">

    <!-- CRISPY ULO -->
   <div class="card">
    <img src="crispy ulo.jpeg">
    <h3>Crispy Ulo</h3>

    <select id="ulo-size">
        <option value="Small-500">Small - ₱500</option>
        <option value="Medium-600">Medium - ₱600</option>
        <option value="Large-700">Large - ₱700</option>
        <option value="Jumbo-800">Jumbo - ₱800</option>
        <option value="Super Jumbo-900">Super Jumbo - ₱900</option>
        <option value="Monster Size-1000">Monster Size - ₱1000</option>
    </select>

    <button onclick="addSizedItem('Crispy Ulo','ulo-size')">
        Add to Cart
    </button>
</div>

    <!-- TANGLAD FRIED CHICKEN -->
    <div class="card">
        <img src="manok.jpeg">
        <h3>Tanglad Fried Chicken</h3>

        <select id="tanglad-size">
            <option value="Half-150">Half - ₱150</option>
            <option value="Whole-300">Whole - ₱300</option>
        </select>

        <button onclick="addSizedItem('Tanglad Fried Chicken','tanglad-size')">
            Add to Cart
        </button>
    </div>

    <!-- FRIED BAGA -->
    <div class="card">
        <img src="baga.jpg">
        <h3>Fried Baga</h3>
        <p>₱250</p>
        <button onclick="addToCart('Fried Baga',250)">Add to Cart</button>
    </div>

    <!-- FRIED DILA -->
    <div class="card">
        <img src="dila.jpeg">
        <h3>Fried Dila</h3>
        <p>₱280</p>
        <button onclick="addToCart('Fried Dila',280)">Add to Cart</button>
    </div>

    <!-- FRIED ITIK -->
    <div class="card">
        <img src="itik.jpg">
        <h3>Fried Itik</h3>
        <p>₱300</p>
        <button onclick="addToCart('Fried Itik',300)">Add to Cart</button>
    </div>

</section>

<script src="script.js"></script>
</body>
</html>
