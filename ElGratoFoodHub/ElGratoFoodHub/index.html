<!DOCTYPE html>
<html>
<head>
<title>HOME</title>

<link rel="stylesheet" href="style.css">

<style>
.carousel{
    width:100%;
    height:100vh;
    overflow:hidden;
}

.slides{
    display:flex;
    width:300%;
    animation:slide 12s infinite;
}

.slide{
    width:100%;
    position:relative;
}

.slide img{
    width:100%;
    height:100vh;
    object-fit:cover;
}

.overlay{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;

    background:rgba(0,0,0,0.5);

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    color:white;
}

@keyframes slide{
0%{transform:translateX(0);}
30%{transform:translateX(0);}
35%{transform:translateX(-100%);}
65%{transform:translateX(-100%);}
70%{transform:translateX(-200%);}
100%{transform:translateX(-200%);}
}
</style>
</head>

<body>

<header>
<nav>
<a href="index.html">HOME</a>
<a href="about.html">ABOUT<US</a>
<a href="menu.html">MENU</a>
<a href="cart.html">CART</a>
<a href="contact.html">CONTACT US</a>

 <a id="authLink" href="login.html">LOGIN</a>
</nav>
</header>

<div class="carousel">

<div class="slides">

<div class="slide">
<img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836">

<div class="overlay">
<h1>EL GRATO FOOD HUB</h1>
<p>Authentic Filipino Flavors</p>

<button onclick="requireLogin()">ORDER NOW</button>

</div>
</div>

<div class="slide">
<img src="https://images.unsplash.com/photo-1544025162-d76694265947">

<div class="overlay">
<h1>FAST DELIVERY</h1>
<p>Hot and Fresh Meals</p>
</div>

</div>

<div class="slide">
<img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1">

<div class="overlay">
<h1>AFFORDABLE MEALS</h1>
<p>Best Filipino Foods</p>
</div>

</div>

</div>

</div>

<script>

// 🔥 LOGIN CHECK (IMPORTANT FIX)
function requireLogin(){

let role = localStorage.getItem("role");

if(!role){
alert("Please login first to order");
window.location.href="login.html";
return;
}

// IF LOGGED IN → go to menu
window.location.href="menu.html";

}

</script>

</body>
