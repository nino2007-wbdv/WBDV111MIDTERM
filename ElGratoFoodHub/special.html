<!DOCTYPE html>
<html>
<head>
    <title>Special Menu - El Grato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>SPECIAL MENU</h1>
</header>

<div class="container">


<div class="card menu-item">
    <img src="itik.jpeg">
    <h3>Fried Itik</h3>

    <div class="size-options">

        <button onclick="addToCart('Fried Itik',300)">
            Order ₱300
        </button>

    </div>
</div>


<div class="card menu-item">
    <img src="chicken.jpeg">
    <h3>Tanglad Fried Chicken</h3>

    <div class="size-options">

        <button onclick="addToCart('Tanglad Fried Chicken Whole',300)">
            Whole ₱300
        </button>

        <button onclick="addToCart('Tanglad Fried Chicken Half',150)">
            Half ₱150
        </button>

    </div>
</div>


<div class="card menu-item">
    <img src="crispyulo.jpeg">
    <h3>Crispy Ulo</h3>

    <div class="size-options">

        <button onclick="addToCart('Crispy Ulo Small',500)">Small ₱500</button>
        <button onclick="addToCart('Crispy Ulo Medium',600)">Medium ₱600</button>
        <button onclick="addToCart('Crispy Ulo Large',700)">Large ₱700</button>
        <button onclick="addToCart('Crispy Ulo Jumbo',800)">Jumbo ₱800</button>
        <button onclick="addToCart('Crispy Ulo Super Jumbo',900)">Super ₱900</button>
        <button onclick="addToCart('Crispy Ulo Monster',1000)">Monster ₱1000</button>

    </div>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
