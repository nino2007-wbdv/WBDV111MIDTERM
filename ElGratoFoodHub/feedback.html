<!DOCTYPE html>
<html>
<head>
<title>Feedback</title>
<link rel="stylesheet" href="style.css">

<style>
.star {
    font-size:30px;
    cursor:pointer;
    color:#555;
}

.star.active {
    color:gold;
}

.review-box{
    margin-top:20px;
    padding:15px;
    border-bottom:1px solid rgba(255,255,255,0.1);
}

textarea{
    width:100%;
    padding:10px;
    margin-top:10px;
    border-radius:10px;
    border:none;
    background:rgba(255,255,255,0.1);
    color:white;
}
</style>

</head>

<body>

<header>
<nav>
<a href="index.html">HOME</a>
<a href="menu.html">MENU</a>
<a href="cart.html">CART</a>
<a href="feedback.html">FEEDBACK</a>
</nav>
</header>

<div class="page">
<div class="card">

<h1>FEEDBACK</h1>

<!-- ⭐ STAR RATING -->
<h3>Rate Us</h3>

<div id="stars">
<span class="star" onclick="rate(1)">★</span>
<span class="star" onclick="rate(2)">★</span>
<span class="star" onclick="rate(3)">★</span>
<span class="star" onclick="rate(4)">★</span>
<span class="star" onclick="rate(5)">★</span>
</div>

<textarea id="comment" placeholder="Write your feedback..."></textarea>

<button onclick="submitFeedback()">SUBMIT</button>

<!-- REVIEWS -->
<h2 style="margin-top:30px;">Customer Reviews</h2>

<div id="reviews"></div>

</div>
</div>

<script>

let selectedRating = 0;

// ⭐ STAR CLICK
function rate(star){
    selectedRating = star;

    let stars = document.querySelectorAll(".star");

    stars.forEach((s, index) => {
        s.classList.toggle("active", index < star);
    });
}

// 📩 SUBMIT FEEDBACK
function submitFeedback(){

let comment = document.getElementById("comment").value;

if(selectedRating === 0){
alert("Please rate first!");
return;
}

if(comment.trim() === ""){
alert("Please write feedback!");
return;
}

let feedbacks = JSON.parse(localStorage.getItem("feedbacks")) || [];

feedbacks.push({
    rating: selectedRating,
    comment: comment
});

localStorage.setItem("feedbacks", JSON.stringify(feedbacks));

document.getElementById("comment").value = "";
selectedRating = 0;
resetStars();

loadFeedbacks();

alert("Thank you for your feedback!");
}

// ⭐ RESET STARS
function resetStars(){
document.querySelectorAll(".star").forEach(s => {
    s.classList.remove("active");
});
}

// 📋 LOAD FEEDBACKS (INCLUDING DUMMY)
function loadFeedbacks(){

let container = document.getElementById("reviews");

let feedbacks = JSON.parse(localStorage.getItem("feedbacks")) || [];

// 🔥 DUMMY DATA (always visible)
let dummy = [
{
rating: 5,
comment: "Sobrang sarap ng pagkain! Highly recommended!"
},
{
rating: 4,
comment: "Affordable at mabilis ang service."
},
{
rating: 5,
comment: "Best Filipino food experience!"
}
];

// merge dummy + real
let all = dummy.concat(feedbacks);

container.innerHTML = "";

all.forEach(f => {

let stars = "★".repeat(f.rating) + "☆".repeat(5 - f.rating);

container.innerHTML += `
<div class="review-box">
<div style="color:gold;">${stars}</div>
<p>${f.comment}</p>
</div>
`;

});

}

loadFeedbacks();

</script>

</body>
</html>
