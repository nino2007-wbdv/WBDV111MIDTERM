<!DOCTYPE html>
<html>
<head>
    <title>Regular Meals</title>

</head>
<body>

<header>
    <h1>Regular Meals</h1>
</header>

<div class="container">

    <div class="card">
        <h3>Adobo Rice</h3>

        <button onclick="addToCart('Adobo Rice',50)">Add to Cart</button>
    </div>

    <div class="card">
        <h3>Tapsilog</h3>
        <p>₱60</p>
        <button onclick="addToCart('Tapsilog',60)">Add to Cart</button>
    </div>

</div>

<div class="container">
    <div class="card">
        <button onclick="checkout()">Checkout</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
