<!DOCTYPE html>
<html>
<head>
    <title>Receipt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Order Receipt</h1>
</header>

<div class="container">
    <div class="card">
        <h2>Thank you for your order!</h2>
        <div id="receiptBox"></div>
    </div>
</div>

<script>
const order = JSON.parse(localStorage.getItem("order"));

let html = "";
let total = 0;

order.items.forEach(item => {
    html += <p>${item.name} - ₱${item.price}</p>;
    total += item.price;
});

html += <hr><h3>Total: ₱${total}</h3>;

document.getElementById("receiptBox").innerHTML = html;
</script>

</body>
</html>
