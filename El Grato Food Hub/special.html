<!DOCTYPE html>
<html>
<head>
    <title>Special Meals</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Special Meals</h1>
</header>

<div class="container">

    <div class="card">
        <h3>Beef Steak</h3>
        <p>₱120</p>
        <button onclick="addToCart('Beef Steak',120)">Add to Cart</button>
    </div>

    <div class="card">
        <h3>Seafood Platter</h3>
        <p>₱150</p>
        <button onclick="addToCart('Seafood Platter',150)">Add to Cart</button>
    </div>

</div>

<div class="container">
    <div class="card">
        <button onclick="checkout()">Checkout</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
