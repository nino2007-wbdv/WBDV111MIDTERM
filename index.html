<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StockMaster</title>
<style>
/* BODY & FONTS */
body { font-family:'Arial', sans-serif; margin:0; background:#f5f7fa; transition:0.3s; }

/* LOGIN PAGE */
#loginPage {
    width:350px;
    margin:120px auto;
    padding:20px;
    background:white;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
    text-align:center;
}
#loginPage input {
    width:90%; padding:10px; margin:10px 0; border-radius:5px; border:1px solid #ccc;
}
#loginPage button {
    width:95%; padding:10px; border:none; border-radius:5px; background:#2b2d42; color:white; cursor:pointer; transition:0.3s;
}
#loginPage button:hover { background:#ef233c; }
#loginError { color:red; font-weight:bold; margin-top:10px; }

/* NAVBAR */
.navbar {
    display:flex; background:#2b2d42; padding:10px; position:sticky; top:0; z-index:100; display:none;
}
.navbar button {
    flex:1; margin:5px; padding:10px; background:#8d99ae; border:none; border-radius:8px;
    color:white; font-size:16px; cursor:pointer; transition:0.3s;
}
.navbar button:hover { background:#ef233c; transform:scale(1.1); }

/* TABS */
.tab { display:none; padding:20px; transition:0.3s; }
.tab.active { display:block; animation:fadeIn 0.5s; }
@keyframes fadeIn { from {opacity:0} to {opacity:1} }

/* TAB BUTTONS */
.content button {
    margin:5px; padding:10px 15px; border:none; border-radius:5px; background:#2b2d42;
    color:white; cursor:pointer; transition:0.3s;
}
.content button:hover { background:#ef233c; transform:scale(1.05); }

/* INFORMATION BOX */
.infoBox { margin-top:10px; padding:10px; background:#fafafa; border-radius:8px; box-shadow:0 0 5px rgba(0,0,0,0.1); }
</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage">
    <h2>StockMaster Login</h2>
    <input type="text" id="username" placeholder="Username" required><br>
    <input type="password" id="password" placeholder="Password" required><br>
    <button onclick="login()">Login</button>
    <p id="loginError"></p>
</div>

<!-- NAVBAR -->
<div class="navbar" id="navbar">
    <button onclick="showTab('dashboard')">📊 Dashboard</button>
    <button onclick="showTab('products')">📦 Products</button>
    <button onclick="showTab('sales')">💰 Sales</button>
    <button onclick="showTab('inventory')">📥 Inventory</button>
    <button onclick="showTab('reports')">📑 Reports</button>
    <button onclick="logout()">🚪 Logout</button>
</div>

<!-- CONTENT -->
<div class="content">
    <div id="dashboard" class="tab">
        <h2>Welcome to StockMaster Dashboard!</h2>
        <p>Use the buttons above to manage your stock system.</p>
    </div>

    <div id="products" class="tab">
        <h2>Products</h2>
        <button onclick="addProduct()">➕ Add Product</button>
        <button onclick="listProducts()">📋 List Products</button>
        <div id="productInfo" class="infoBox">No actions yet.</div>
    </div>

    <div id="sales" class="tab">
        <h2>Sales</h2>
        <button onclick="recordSale()">📝 Record Sale</button>
        <button onclick="viewSales()">📊 View Sales</button>
        <div id="salesInfo" class="infoBox">No actions yet.</div>
    </div>

    <div id="inventory" class="tab">
        <h2>Inventory</h2>
        <button onclick="checkInventory()">🔍 Check Inventory</button>
        <div id="inventoryInfo" class="infoBox">No actions yet.</div>
    </div>

    <div id="reports" class="tab">
        <h2>Reports</h2>
        <button onclick="generateReport()">📄 Generate Report</button>
        <div id="reportInfo" class="infoBox">No actions yet.</div>
    </div>
</div>

<script>
// LOGIN
function login(){
    const username=document.getElementById('username').value;
    const password=document.getElementById('password').value;
    if(username==='admin' && password==='stock123'){
        document.getElementById('loginPage').style.display='none';
        document.getElementById('navbar').style.display='flex';
        showTab('dashboard');
    } else {
        document.getElementById('loginError').innerText='❌ Invalid username or password';
    }
}

// LOGOUT
function logout(){
    location.reload();
}

// TAB NAVIGATION
function showTab(tabId){
    document.querySelectorAll('.tab').forEach(tab=>tab.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
}

// PRODUCTS
function addProduct(){ document.getElementById('productInfo').innerText='✅ Product added successfully!'; }
function listProducts(){ document.getElementById('productInfo').innerText='📋 Listing all products...'; }

// SALES
function recordSale(){ document.getElementById('salesInfo').innerText='📝 Sale recorded successfully!'; }
function viewSales(){ document.getElementById('salesInfo').innerText='📊 Showing sales data...'; }

// INVENTORY
function checkInventory(){ document.getElementById('inventoryInfo').innerText='🔍 Inventory checked!'; }

// REPORTS
function generateReport(){ document.getElementById('reportInfo').innerText='📄 Report generated successfully!'; }
</script>

</body>
</html>
