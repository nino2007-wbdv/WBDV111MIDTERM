<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gold Ribbon</title>

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #121212;
    color: #fff;
    display: flex;
}

/* SIDEBAR (GLASS EFFECT) */
.sidebar {
    width: 220px;
    height: 100vh;
    background: rgba(30, 30, 30, 0.6);
    backdrop-filter: blur(10px);
    padding: 20px;
    position: fixed;
}

.sidebar h2 {
    color: #ffb703;
    text-align: center;
}

.sidebar button {
    display: block;
    width: 100%;
    margin: 10px 0;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: rgba(255,255,255,0.1);
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

.sidebar button:hover {
    background: #ffb703;
    color: black;
}

/* MAIN */
.main {
    margin-left: 240px;
    width: 100%;
}

/* CAROUSEL */
.banner {
    height: 300px;
    position: relative;
    overflow: hidden;
}

.slide {
    position: absolute;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: 1s;
}

.slide.active {
    opacity: 1;
}

.overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
}

.banner-text {
    position: relative;
    z-index: 2;
    text-align: center;
    top: 50%;
    transform: translateY(-50%);
}

/* SECTION */
section {
    padding: 30px;
    text-align: center;
}

/* GRID */
.grid {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
}

/* CARD */
.card {
    width: 220px;
    background: #1f1f1f;
    border-radius: 15px;
    padding: 15px;
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.05);
}

.card img {
    width: 100%;
    height: 150px;
    border-radius: 10px;
    object-fit: cover;
}

/* BUTTON */
.add {
    margin-top: 10px;
    padding: 10px;
    width: 100%;
    border: none;
    border-radius: 20px;
    background: #ffb703;
    color: black;
    cursor: pointer;
}

/* CART */
#cartItems {
    max-width: 400px;
    margin: auto;
    background: #1f1f1f;
    padding: 20px;
    border-radius: 10px;
}

/* LOGIN */
.login-box {
    background: #1f1f1f;
    padding: 20px;
    border-radius: 10px;
    width: 250px;
    margin: auto;
}

input {
    width: 90%;
    padding: 10px;
    margin: 8px;
    border-radius: 8px;
    border: none;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>Gold Ribbon</h2>
    <button onclick="showPage('home')">🏠 Home</button>
    <button onclick="showPage('shop')">🛍 Shop</button>
    <button onclick="showPage('cart')">🛒 Cart (<span id="count">0</span>)</button>
    <button onclick="showPage('login')">🔐 Login</button>
    <button onclick="logout()">🚪 Logout</button>
</div>

<div class="main">

<!-- CAROUSEL -->
<div class="banner">
    <div class="slide active" style="background-image:url('lanera.jpg')"></div>
    <div class="slide" style="background-image:url('cake.jpg')"></div>
    <div class="slide" style="background-image:url('background.png')"></div>

    <div class="overlay"></div>

    <div class="banner-text">
        <h1>Gold Ribbon</h1>
        <p>Delicious cakes made with love</p>
    </div>
</div>

<section id="home">
    <h2>Our Cakes</h2>
    <div class="grid" id="cakeList"></div>
</section>

<section id="shop" style="display:none;">
    <h2>Shop</h2>
    <div class="grid" id="shopList"></div>
</section>

<section id="cart" style="display:none;">
    <h2>Your Cart</h2>
    <div id="cartItems"></div>
</section>

<section id="login" style="display:none;">
    <div class="login-box">
        <h3>Login</h3>
        <input id="user" placeholder="Username"><br>
        <input id="pass" type="password" placeholder="Password"><br>
        <button onclick="login()">Login</button>
        <p id="loginMsg"></p>
    </div>
</section>

</div>

<script>
const cakes = [
    { name:"Chocolate Cake", price:850, img:"choco.jpg" },
    { name:"Strawberry Cake", price:950, img:"strawberry.jpg" },
    { name:"Vanilla Cake", price:950, img:"vanilla.jpg" },
    { name:"Red Velvet", price:800, img:"red velvet.jpg" },
    { name:"Mocha Cake", price:850, img:"mocha.jpg" }
];

let cart = [];
let isLoggedIn = false;

function displayCakes() {
    const home = document.getElementById("cakeList");
    const shop = document.getElementById("shopList");

    home.innerHTML = "";
    shop.innerHTML = "";

    cakes.forEach((cake, index) => {
        let card = `
        <div class="card">
            <img src="${cake.img}">
            <h4>${cake.name}</h4>
            <p>₱${cake.price}</p>
            <button class="add" onclick="addToCart(${index})">Order</button>
        </div>`;
        home.innerHTML += card;
        shop.innerHTML += card;
    });
}

function addToCart(index) {
    if(!isLoggedIn){
        alert("log in first!");
        showPage('login');
        return;
    }
    cart.push(cakes[index]);
    updateCart();
}

function updateCart() {
    const cartDiv = document.getElementById("cartItems");
    const count = document.getElementById("count");

    if(cart.length === 0){
        cartDiv.innerHTML = "<p>Empty cart 🛒</p>";
        count.innerText = 0;
        return;
    }

    cartDiv.innerHTML = "";
    let total = 0;

    cart.forEach((item, index) => {
        total += item.price;
        cartDiv.innerHTML += `
        <p>${item.name} - ₱${item.price}
        <button onclick="removeItem(${index})">❌</button></p>`;
    });

    cartDiv.innerHTML += `<h3>Total: ₱${total}</h3>`;
    count.innerText = cart.length;
}

function removeItem(index) {
    cart.splice(index, 1);
    updateCart();
}

function showPage(page) {
    if((page === "cart" || page === "shop") && !isLoggedIn){
        alert("Login muna!");
        page = "login";
    }
    document.querySelectorAll("section").forEach(sec => sec.style.display="none");
    document.getElementById(page).style.display="block";
}

function login() {
    let user = document.getElementById("user").value;
    let pass = document.getElementById("pass").value;

    if(user === "admin" && pass === "1234"){
        isLoggedIn = true;
        alert("Welcome!");
        showPage("home");
    } else {
        document.getElementById("loginMsg").innerText = "Wrong credentials";
    }
}

function logout(){
    isLoggedIn = false;
    cart = [];
    updateCart();
    alert("Logged out!");
    showPage("home");
}

/* CAROUSEL AUTO SLIDE */
let slides = document.querySelectorAll(".slide");
let current = 0;

setInterval(() => {
    slides[current].classList.remove("active");
    current = (current + 1) % slides.length;
    slides[current].classList.add("active");
}, 3000);

displayCakes();
updateCart();
</script>

</body>
</html>
